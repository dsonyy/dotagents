# Ctrl+a over Ctrl+b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# vi over emacs
set -g mode-keys vi

# 1-indexed over 0-indexed
set -g base-index 1
setw -g pane-base-index 1

# longer scroll history
set -g history-limit 25000

# reload config
bind r source-file ~/.tmux.conf \; display "config reloaded"

# mount plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: save scrollback state
set -g @resurrect-capture-pane-contents 'on'
# pin the save dir: resurrect silently falls back to ~/.tmux/resurrect
# if that directory ever comes into existence
set -g @resurrect-dir '$HOME/.local/share/tmux/resurrect'

# continuum: periodic save only. Restore is owned by the block in ~/.zshrc,
# so leave this off - two restorers race and produce "duplicate session: main".
set -g @continuum-save-interval '5'
set -g @continuum-restore 'off'

# run tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'

